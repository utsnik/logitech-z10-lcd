            #volumeWrapper

	            -webkit-box-shadow: 0 0 20px #8ad5f4;

            }

            .ui-slider {
	            position: relative;
	            text-align: left;
            }
            .ui-slider .ui-slider-handle {
	            position: absolute;
	            z-index: 2;
	            width: 1.2em;
	            height: 1.2em;
                -webkit-tap-highlight-color:rgba(0,0,0,0);
                outline: none;
            }
            .ui-slider .ui-slider-range {
	            position: absolute;
	            z-index: 1;
	            font-size: .7em;
	            display: block;
	            border: 0;
	            background-position: 0 0;
            }

            /* For IE8 - See #6727 */
            .ui-slider.ui-state-disabled .ui-slider-handle,
            .ui-slider.ui-state-disabled .ui-slider-range {
	            filter: inherit;
            }
            .ui-slider-horizontal .ui-slider-handle {
	            margin-left: -.6em;
            }
            .ui-slider-horizontal .ui-slider-range {
	            top: 0;
	            height: 100%;
            }
            .ui-slider-horizontal .ui-slider-range-min {
	            left: 0;
            }
            .ui-slider-horizontal .ui-slider-range-max {
	            right: 0;
            }
            .ui-slider-horizontal
            {
                background-color: rgba(0,0,0,0);
                width:90%;
                height:100%;
               /* margin-left:3%;*/
                margin-right:0%;
            }

            .ui-slider-horizontal .ui-slider-handle
            {
                background-image: url('img/Media_SliderThumb@3x.png');

            .box{
	            border-style: solid 10px #8ad5f4;
	            border-width: 10px;
	            border-radius: 10px;
	            -webkit-box-shadow: 0 0 10px #8ad5f4;
	            box-shadow: 0 0 10px #8ad5f4;
	            margin:20%;
	            padding: 15px;
	            margin-left: 5%;
            }
            #volumeSlider
            {
                display: none;
            }

    <body>
        <div id="wrapper">
        <table id="controlTable">
            <tr>
                <td id ="prevTrackCell" rowspan="2" class ="box highlitableCell"></td>
                <td id ="playPauseCell" class ="box highlitableCell"></td>
                <td id ="nextTrackCell" rowspan="2" class ="box highlitableCell"></td>
            </tr>
            <tr> 
                <td id ="stopCell" class ="box highlitableCell"></td> 
            </tr>
            </table>   
            <div id="volumeSlider">0</div>
            <div id="volumeWrapper">
                <div id="volumeDiv"></div>
            </div>
            <table id="muteButtonsTable" >
                <tr>
                    <td id ="muteMasterCell" class ="box highlitableCell">

                    </td>
                    <td id ="muteMicCell" class ="box highlitableCell">

                    </td>
                </tr>
            </table>
        </div>
        <script>
		    function handleOrientationChange() {
			    
				if (window.orientation == 90 || window.orientation == -90) {
					//console.log("landscape");
					$("#controlTable").css('height','40%');
					$("#muteButtonsTable").css('margin-top','5%');
				}
				else
				{
					//console.log("portrait");
					$("#controlTable").css('height','50%');
					$("#muteButtonsTable").css('margin-top','10%');
				}
				var height = $( "#volumeDiv" ).height();
				var width = $( "#volumeWrapper" ).width();
				//console.log('width:'+width+' height:'+height);
				$('.ui-slider-horizontal .ui-slider-handle').height(height);
				$('.ui-slider-horizontal .ui-slider-handle').width(height);
				$('.ui-slider-horizontal .ui-slider-handle').css('background-size','contain'); 
				//$('.ui-slider-horizontal .ui-slider-handle').css('background-size',height+'px '+height+'px'); 
				$('.ui-slider-handle').css('margin-left','-'+(height/2)+'px');
				$('.ui-slider-horizontal').css('margin-left',(height/2)+'px');
				$('.ui-slider-horizontal').css('width',width-height+'px');
			}
		    $( document ).ready(function() {
			    $('body').bind('orientationchange', handleOrientationChange);
				handleOrientationChange();
			  });
			
			$("#volumeDiv").slider({
                min: 0,
                max: 1,
                step: 0.02,
                slide: function (event, ui) {
                    acceptingUpdates = false;
                    updateSlider(ui.value);
                },
                change: function (event, ui) {
                    acceptingUpdates = true;
                }
				});
            var acceptingUpdates = true;

            $("#volumeWrapper").mousedown(function () {
                var itm = $('.ui-slider-horizontal .ui-slider-handle');
                if (!itm.hasClass('androidActive')) {
                    itm.addClass('androidActive');
                }
            });
            $("#volumeWrapper").mouseup(function () {
                var itm = $('.ui-slider-horizontal .ui-slider-handle');
                if (itm.hasClass('androidActive')) {
                    itm.removeClass('androidActive');
                }
            });

            onPropertyUpdate = function () {
                if (acceptingUpdates)
				{
					var sliderPos = parseFloat($("#volumeSlider").html());
                    $("#volumeDiv").slider("value",sliderPos);
					//console.log("slider pos is:"+sliderPos);
				}
            }

            function updateSlider(value) {
              ACBridge.click("volumeSliderChange." + value);
            }
            $(".highlitableCell")
                .bind("touchstart", function () {
                    $(this).addClass("androidActive");
                })
                .bind("touchend", function () {
                    $(this).removeClass("androidActive");
                })
                .bind("touchcancel", function () {
                    $(this).removeClass("androidActive");
                });
        </script>
    </body>
