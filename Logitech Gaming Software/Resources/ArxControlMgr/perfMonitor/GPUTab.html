<html>
<head>

	<script src="..\jQuery\jquery-1.7.2.min.js"></script>
	<script src="..\jQuery\jquery.mobile\jquery.mobile-1.4.2.js"></script>

	<script type="text/javascript" src="GPUTab.js">
	
	</script>

</head>
<body>
	<div id="GPU" class="GPU box" style="overflow:scroll">
	<div id="GPUcontain">
	<div id="GPUprefab" class="GPUtab">
        <h2 class="gpuIcon"><span data-trstring="gpuText">GPU</span> <span id="GPUcount"></span></h2>
        <div id="GPUBadges" style="clear:both; width:100%">
		    <h3 class="tempIcon" id="GPUTempv" style="float:left">0</h3>
 		    <h3 class="usageIcon" id="GPUUsagev"style="float:left">C% </h3>
 		    <h3 class="clockIcon" id="GPUClockSpeedv">425</h3>
 		    <h3 class="fanIcon" id="GPUFanSpeedv">0</h3>
        </div>
        <table id="ATITable" style="width:90%; margin-left:2%">
			<tbody>
			</tbody>
		</table>
 		<div id="ATIBlock" style="display:none">
			<div class="atiBucket" > <span data-trstring="engineClockText">Engine Clock</span> <p id="EngineClockv">	</p></div>
			<div class="atiBucket" > <span data-trstring="memoryClockText">Memory Clock</span> <p id="MemoryClockv">	</p></div>
			<div class="atiBucket" > <span  data-trstring="busSpeedText">Bus Speed 	</span> <p id="BusSpeedv">		</p></div>
			<div class="atiBucket" > <span data-trstring="gpuVoltageText">GPU Voltage 	</span> <p id="GPUVoltagev">	</p></div>
		</div>
		<div id="NvidiaBlock" >
			<tbody>
			<table id ="NVIDIATable" style="width:90%; margin-left:2%">
			<tr id="usageBlock">
				<td data-trstring="gpuUsageText">GPU Usage</td>
				<td class="horizBar"><div><span id="GPUUsageB"> </span></div></td>
				<td id="altGPUUsagev"> 5  </td>
			</tr>
			<tr>
				<td data-trstring="frameBufferText">Frame Buffer</td>
				<td class="horizBar"><div><span id="FrameBufferB"> </span></div></td>
				<td id="FrameBufferv"> 5  </td>
			</tr>
			<tr>
				<td data-trstring="videoEngineText">Video Engine</td>
				<td class="horizBar"><div><span id="VideoEngineB"> </span></div></td>
				<td id="VideoEnginev">   </td>
			</tr>
			<tr>
				<td data-trstring="gpuMemoryText">GPU Memory</td>
				<td class="horizBar"><div><span id="GPUMemoryB"> </span></div></td>
				<td id="GPUMemoryv">   </td>
			</tr>
			</tbody>
			</table>
		</div>
		</div>
	</div>
	<div id="GPUpips">
		<a class="active"> </a>
	</div>
	</div>
	<script type="text/javascript">
	var g = tabModule("GPU");
	g.resizeTo(4);
	</script>
</body>
</html>
