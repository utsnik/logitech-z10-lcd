<html>
<head>
      <meta name="viewport" content="user-scalable=no" />
<link rel="stylesheet" type="text/css" href="PerfMon.css">
<style type="text/css">
*{margin:0; padding:0;}
body{background:#002A37;};
</style>
<script src="http://code.jquery.com/jquery-1.11.0.min.js"></script>
	<!--script src="jquery-1.10.1.js"></script -->
	<script src="updateFunctions.js" > </script>

		<script type="text/javascript">
			var i = 0;
      miniApplet = true;
    var htmlInit = function(){
      retrieveLocalizedStrings();
      $(window).resize( miniRedistribute );
      onPropertyUpdate();
			miniRedistribute();
		};
	</script>
</head>
<body>
<div id="CPU" style="width:33%; height:100%" class="minDivider">
  <h2 class="cpuIcon" data-trstring="cpuText">CPU</h2>
  <h2 id="CPUUsagev" class="usageIcon" style="float:right">C% </h2>
  <div class="horizBar" style="height:50%; clear:both"><div><span id="CPUUsageB"></span></div></div>
</div>
<div id="GPU" style="width:33%; height:100%"  class="minDivider">
  <h2 class="gpuIcon" data-trstring="gpuText"> GPU</h2>
  <h2 class="usageIcon" id="GPUUsagev"style="float:right">C% </h2>
  <h2 class="tempIcon" id="GPUTempv"  style="float:right">gD  </h2>
  <div class="horizBar" style="height:50%; clear:both"><div><span id="GPUUsageB"></span></div></div>
</div>
<div id="RAM" style="width:33%; height:100%" class="minDivider">
  <h2 class="ramIcon" data-trstring="ramText">RAM</h2>
  <div id="piechart" style="margin: 2%; display:inline-block;" class ="circle">
      <div id="piece1" class="hold">
          <div class="pie"></div>
      </div>
      <div class="overlay">
        <span>$PERCENT</span>
        <p class="centered"></p>
      </div>
  </div>
  <div style="margin-right: 2%; margin-left: 2%; display:inline-block;"> 
     <div class="ramUsage ramItemMini">
        <div class="squareIcon ramFree"></div>  <span id="RAMFree"> 0</span>
     </div>
    <div class="ramUsage ramItemMini" >
      <div class="squareIcon ramTotal"></div> 
      <span id="RAMTotal">0</span>
    </div>
  </div>
</div>
<div class ="prop" id="prop">
  <p id="numGPU">1</p>
  <p id="CPUTemp">0|99&#176;c</p>
  <p id="CPUUsage">0|100%  </p>
  <p id="RAMUsage"> 0|16 gb  </p>
  <p id="GPUTemp" > 0|70&#176;c</p>
  <p id="GPUFanSpeed">0|100rpm</p>
  <p id="GPUUsage">0|100%</p>
  <p id="FrameBuffer" > 0|100%</p>
  <p id="VideoEngine" > 0|100%</p>
  <p id="BusInterface" > 0|100%</p>
  <p id="GPUMemory" > 0|100%</p>
  <p id="GPUClockSpeed" > 0|100%</p>
  <p id="MemoryClockSpeed" > 0|100%</p>
  <p id="EngineClock">0</p>
  <p id="MemoryClock">0</p>
  <p id="BusSpeed">0 </p>
  <p id="GPUVoltage">0</p>
  <p id="ATIBlock"></p>
  <p id="NvidiaBlock"></p>
  <p id="CPUClockSpeed"></p>
</div>
</body>
</html>
